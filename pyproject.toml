[project]
name = "ai-change-analyzer"
version = "0.1.0"
description = "AI-assisted production change risk analysis using LangGraph, RAG, and deterministic scoring."
readme = "README.md"
authors = [
    { name = "YogeshCodes09", email = "yogeshmudaliyar09@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "langchain-core>=1.3.0",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.3.7",
    "langgraph>=1.2.11",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
    "streamlit>=1.62.0",
]

[project.scripts]
ai-change-analyzer = "ai_change_analyzer.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]